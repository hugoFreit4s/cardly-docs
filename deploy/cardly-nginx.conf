# Host nginx vhost for Cardly on the shared Sisges EC2.
# Install:
#   sudo cp cardly-nginx.conf /etc/nginx/sites-available/cardly
#   sudo ln -sf /etc/nginx/sites-available/cardly /etc/nginx/sites-enabled/cardly
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS A record points to this EC2):
#   sudo certbot --nginx -d cardly.hugodefreitas.com.br

server {
    listen 80;
    listen [::]:80;
    server_name cardly.hugodefreitas.com.br;

    client_max_body_size 15m;

    location /api {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
